name: leadmantra
description: "LeadMantra — WhatsApp-first CRM for Indian businesses by OnesNZeros Tech Solutions."
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.0.0
  shared_preferences: ^2.2.0
  webview_flutter: ^4.13.1
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo_1 1.png"
  fullscreen: true
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_3 1.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
